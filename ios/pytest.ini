[pytest]
# iOS-тесты запускаются из этой папки: cd ios && ../.venv/bin/pytest
testpaths = tests
pythonpath = tests
addopts = -v --import-mode=importlib
markers =
    title(name): человекочитаемое название тест-кейса для админки
    fields(*pairs): (ENV_VAR, "подпись"[, "optional"]) — доп. поля ввода в админке перед запуском кейса
    record_video: записать экран Simulator на время теста (видео — рядом со скриншотами падений)
    fresh_app: перед тестом удалить приложение с Simulator (чистые данные: вход, язык)
