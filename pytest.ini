[pytest]
testpaths = tests
pythonpath = tests
# importlib: tests/uz/test_launch.py и tests/kz/test_launch.py совпадают по имени файла
addopts = -v --import-mode=importlib
markers =
    title(name): человекочитаемое название тест-кейса для админки
    fields(*pairs): (ENV_VAR, "подпись") — доп. поля ввода в админке перед запуском кейса,
        подставляются в окружение процесса как переменные ENV_VAR
    fresh_app: перед тестом стереть данные приложения (вход, язык) — для сборок с no_reset
